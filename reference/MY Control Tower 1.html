<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Management Control Tower</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #eef1f5;
      --c: #fff;
      --t: #1f2937;
      --m: #6b7280;
      --b: #2563eb;
      --g: #16a34a;
      --a: #d97706;
      --r: #dc2626;
      --n: #9ca3af;
      --sh: 5px 5px 12px #d3d9e2, -5px -5px 12px #fff
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 14px/1.45 system-ui, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--t);
      display: grid;
      grid-template-columns: 200px 1fr;
      min-height: 100vh
    }

    aside {
      background: #f8fafc;
      padding: 14px 10px;
      box-shadow: var(--sh);
      position: sticky;
      top: 0;
      height: 100vh
    }

    aside h1 {
      font-size: 15px;
      margin: 4px 8px 14px;
      color: var(--b)
    }

    aside a {
      display: block;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--m);
      margin-bottom: 2px
    }

    aside a.on {
      background: #fff;
      color: var(--b);
      box-shadow: var(--sh);
      font-weight: 600
    }

    main {
      padding: 16px 22px;
      min-width: 0
    }

    header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
      padding: 6px 9px;
      border: 1px solid #d5dbe4;
      border-radius: 8px;
      background: #fff;
      color: var(--t)
    }

    button {
      cursor: pointer
    }

    button:hover {
      border-color: var(--b)
    }

    button.pri {
      background: var(--b);
      color: #fff;
      border-color: var(--b)
    }

    button.dng {
      color: var(--r)
    }

    .card {
      background: var(--c);
      border-radius: 14px;
      box-shadow: var(--sh);
      padding: 14px;
      margin-bottom: 14px
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))
    }

    .kpi {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .kpi div {
      flex: 1;
      min-width: 120px;
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--sh);
      padding: 10px 14px
    }

    .kpi b {
      font-size: 22px;
      display: block
    }

    .kpi span {
      color: var(--m);
      font-size: 12px
    }

    .tw {
      overflow: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px
    }

    th {
      text-align: left;
      color: var(--m);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 2px solid #e5e9f0;
      white-space: nowrap
    }

    td {
      padding: 6px 8px;
      border-bottom: 1px solid #eef1f5;
      vertical-align: top
    }

    tr.late td {
      background: #fef2f2
    }

    .emp {
      color: var(--m);
      text-align: center;
      padding: 18px
    }

    .pill {
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 12px;
      color: #fff;
      white-space: nowrap
    }

    .Green,
    .Done,
    .Balanced {
      background: var(--g)
    }

    .Amber,
    .Underutilised {
      background: var(--a)
    }

    .Red,
    .Overloaded {
      background: var(--r)
    }

    .Grey,
    .na {
      background: var(--n)
    }

    .Blue {
      background: var(--b)
    }

    .dr {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 3px 0;
      font-size: 12px
    }

    .dr span {
      width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .bar2 {
      flex: 1;
      background: #e8ecf2;
      border-radius: 6px;
      height: 8px
    }

    .bar2 i {
      display: block;
      height: 8px;
      border-radius: 6px;
      background: var(--b)
    }

    .top {
      display: flex;
      gap: 10px;
      border-left: 4px solid var(--b);
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #f8fafc;
      border-radius: 8px
    }

    .top .n {
      font-weight: 700;
      color: var(--b);
      font-size: 18px
    }

    .top p {
      margin: 2px 0
    }

    .m {
      color: var(--m)
    }

    #banner {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px
    }

    .mb {
      position: fixed;
      inset: 0;
      background: #0006;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      padding: 30px 10px;
      z-index: 9
    }

    .md {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      width: min(680px, 100%)
    }

    .md label {
      display: block;
      margin: 8px 0;
      font-size: 12px;
      color: var(--m)
    }

    .md input,
    .md select,
    .md textarea {
      display: block;
      width: 100%;
      margin-top: 3px
    }

    .md textarea {
      min-height: 56px
    }

    .team-alloc-box {
      background: #f8fafc;
      border: 1px solid #d5dbe4;
      border-radius: 8px;
      padding: 10px;
      margin-top: 4px;
    }

    .team-alloc-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .team-alloc-row select {
      flex: 2;
      margin-top: 0 !important;
    }

    .team-alloc-pct-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      max-width: 100px;
    }

    .team-alloc-pct-wrap input {
      margin-top: 0 !important;
      width: 100%;
    }

    .team-alloc-pct-wrap span {
      font-size: 12px;
      color: var(--m);
    }

    .team-alloc-del {
      padding: 4px 8px !important;
      font-size: 14px !important;
      line-height: 1;
      margin-top: 0 !important;
      cursor: pointer;
    }

    .bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap
    }

    .gantt .gr {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin: 2px 0
    }

    .gantt .gr>span {
      width: 150px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis
    }

    .gt {
      position: relative;
      flex: 1;
      height: 14px;
      background: #eef1f5;
      border-radius: 6px
    }

    .gb {
      position: absolute;
      height: 14px;
      border-radius: 6px
    }

    .gt b {
      position: absolute;
      top: -2px;
      height: 18px;
      width: 2px;
      background: var(--r)
    }

    .fl {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .chk {
      cursor: pointer
    }

    .manual h4 {
      margin: 14px 0 4px
    }

    .manual p,
    .manual li {
      margin: 3px 0
    }

    @media(max-width:800px) {
      body {
        grid-template-columns: 1fr
      }

      aside {
        position: static;
        height: auto;
        display: flex;
        overflow: auto
      }

      aside h1 {
        display: none
      }

      aside a {
        white-space: nowrap
      }
    }
  </style>
</head>

<body>
  <aside id="nav"></aside>
  <main>
    <header><input id="gs" placeholder="Search everything… (Enter)" style="min-width:220px"><select
        id="qa"></select><span class="m" id="lb"></span></header>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
  <div id="modal"></div>
  <script>
    const $ = s => document.querySelector(s), KEY = 'ct_v1', TODAY = () => new Date().toISOString().slice(0, 10);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const PR = ['Critical', 'High', 'Medium', 'Low'], ST = ['Ideation', 'Not started', 'In progress', 'Enhancement', 'Blocked', 'On hold', 'Completed', 'Ongoing', 'Under Validation', 'Cancelled'], ACT = ['In progress', 'Enhancement', 'Blocked', 'Under Validation', 'Ongoing'], CAT = ['Commercial', 'Business Challenge', 'Governance', 'Functional', 'Project Tracking', 'Miscellaneous'], MSS = ['Not Started', 'In Progress', 'Done', 'Blocked'], YN = ['Yes', 'No'];
    const f = (k, l, req, type, o) => ({ k, l, req, type: type || 'text', o });
    const S = {
      init: { t: 'Initiatives', p: 'INI', f: [f('id', 'ID', 0), f('name', 'Name', 1), f('categoryLead', 'Category Lead'), f('category', 'Category', 0, 'enum', CAT), f('description', 'Description', 0, 'area'), f('objective', 'Business objective', 0, 'area'), f('sponsor', 'Sponsor'), f('priority', 'Priority', 2, 'enum', PR), f('owner', 'Accountable owner (Team ID)', 0, 'ref', 'team'), f('team', 'Team allocation'), f('start', 'Planned start', 0, 'date'), f('target', 'Target completion', 0, 'date'), f('status', 'Status', 1, 'enum', ST), f('progress', 'Manual progress % (if no milestones)', 0, 'num'), f('remarks', 'Remarks', 0, 'area'), f('risks', 'Key risks', 0, 'area'), f('deps', 'Dependencies'), f('dev', 'Development done', 0, 'enum', YN), f('test', 'Testing done', 0, 'enum', YN), f('accept', 'Business acceptance', 0, 'enum', YN), f('trained', 'Users trained', 0, 'enum', YN), f('rollout', 'Rollout completed', 0, 'enum', YN), f('adopt', 'Adoption achieved', 0, 'enum', YN), f('evidence', 'Adoption evidence'), f('updated', 'Last update', 0, 'date')] },
      team: { t: 'Team', p: 'EMP', f: [f('id', 'ID', 1), f('name', 'Name', 1), f('designation', 'Designation'), f('role', 'Role'), f('skills', 'Skills (comma separated)'), f('primary', 'Primary responsibilities'), f('secondary', 'Secondary responsibilities'), f('backlog', 'Estimated backlog (person-days)', 0, 'num')] },
      ms: { t: 'Schedule', p: 'MS', f: [f('id', 'ID', 1), f('iid', 'Initiative ID', 1, 'ref', 'init'), f('name', 'Activity / milestone', 1), f('pStart', 'Planned start', 0, 'date'), f('pEnd', 'Planned finish', 0, 'date'), f('aStart', 'Actual start', 0, 'date'), f('aEnd', 'Actual finish', 0, 'date'), f('status', 'Status', 1, 'enum', MSS), f('holder', 'Action holder (Team ID)', 0, 'ref', 'team'), f('deps', 'Dependencies'), f('remarks', 'Remarks'), f('link', 'Evidence / deliverable link'), f('gate', 'Validation gate', 0, 'enum', ['Pending', 'Validated', 'Rejected']), f('vdate', 'Validated / rejected on', 0, 'date'), f('vnote', 'Validation note')] },
      demand: { t: 'Demand', p: 'REQ', f: [f('id', 'ID', 1), f('name', 'Request name', 1), f('description', 'Description', 0, 'area'), f('requester', 'Requester'), f('sponsor', 'Sponsor'), f('value', 'Business value', 0, 'area'), f('urgency', 'Urgency', 0, 'enum', ['Low', 'Medium', 'High']), f('priority', 'Priority', 0, 'enum', PR), f('effort', 'Estimated effort (allocation % points)', 0, 'num'), f('reqDate', 'Requested completion', 0, 'date'), f('deps', 'Dependencies'), f('remarks', 'Remarks'), f('decision', 'Decision', 1, 'enum', ['New', 'Accepted', 'Rejected', 'Deferred', 'Clarification required'])] },
      act: { t: 'Actions', p: 'ACT', f: [f('id', 'ID', 1), f('iid', 'Initiative ID', 0, 'ref', 'init'), f('type', 'Type', 1, 'enum', ['Decision', 'Approval', 'Blocker', 'Commitment', 'Action']), f('title', 'Title', 1), f('owner', 'Owner (Team ID)', 0, 'ref', 'team'), f('due', 'Due date', 0, 'date'), f('status', 'Status', 1, 'enum', ['Open', 'Done']), f('severity', 'Severity', 0, 'enum', ['Minor', 'Critical']), f('raised', 'Raised on', 0, 'date'), f('remarks', 'Remarks')] }
    };
    const MODS = Object.keys(S), TR = { init: ['priority', 'owner', 'target', 'start', 'status', 'team', 'categoryLead'], ms: ['pEnd', 'status', 'gate'], act: ['status', 'owner', 'due'] };
    const DEF = () => ({ init: [], team: [], ms: [], demand: [], act: [], hist: [], views: {}, lastBackup: null, cfg: { buffer: 20, stale: 14, blockerDays: 7, soon: 7, backupDays: 7 } });
    function loadDB() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.init) return fix(d) } catch (e) { } return DEF() }
    function fix(d) { const b = DEF(); Object.keys(b).forEach(k => { if (d[k] == null) d[k] = b[k] }); d.cfg = { ...b.cfg, ...d.cfg }; const mp = { 'Active': 'In progress', 'Not Started': 'Not started', 'On Hold': 'On hold', 'Deferred': 'On hold' }; d.init.forEach(i => { if (mp[i.status]) i.status = mp[i.status] }); return d }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(D)) } catch (e) { alert('Could not save to browser storage: ' + e.message) } }
    let D = loadDB(), V = 'dash', P = null, F = {}, SC = { ch: [], nw: null }, IMP = null;
    const nm = id => D.team.find(x => x.id == id || x.name == id)?.name || id || '—', tm = id => D.team.find(x => x.id == id || x.name == id), ini = id => D.init.find(x => x.id == id);
    const days = (a, b = TODAY()) => Math.round((new Date(a) - new Date(b)) / 864e5), age = a => a.raised ? Math.max(0, days(TODAY(), a.raised)) : 0, pw = x => PR.includes(x) ? 4 - PR.indexOf(x) : 0;
    const log = (m, id, field, from, to, note) => { D.hist.unshift({ t: new Date().toISOString(), m, id, field, from: from ?? '', to: to ?? '', note: note || '' }); D.hist.length = Math.min(D.hist.length, 2000) };
    function nextId(m) { const p = S[m].p; let mx = 0; D[m].forEach(r => { const x = String(r.id).match(new RegExp('^' + p + '-(\\d+)$')); if (x) mx = Math.max(mx, +x[1]) }); return p + '-' + String(mx + 1).padStart(3, '0') }
    const parseAlloc = s => (s || '').split(/[,;]/).map(x => x.trim().split(':')).filter(a => a[0] && a[0].trim()).map(a => [a[0].trim(), +a[1] || 0]);
    const ld = (id, list = D.init) => list.filter(i => ACT.includes(i.status)).reduce((s, i) => s + (parseAlloc(i.team).find(a => a[0] == id || tm(a[0])?.id == id)?.[1] || 0), 0);
    function allocEmpOptions(selectedId = '') {
      let opts = '<option value="">— Select Employee —</option>', found = false;
      D.team.forEach(p => {
        const sel = !!(selectedId && (p.id == selectedId || p.name == selectedId));
        if (sel) found = true;
        opts += `<option value="${esc(p.id)}" ${sel ? 'selected' : ''}>${esc(p.name)} (${esc(p.id)})</option>`;
      });
      if (selectedId && !found) opts += `<option value="${esc(selectedId)}" selected>${esc(selectedId)}</option>`;
      return opts;
    }
    function createAllocRowHtml(empId = '', pct = '') {
      return `<div class="team-alloc-row"><select class="team-alloc-emp">${allocEmpOptions(empId)}</select><div class="team-alloc-pct-wrap"><input type="number" class="team-alloc-pct" min="0" max="100" step="5" placeholder="%" value="${pct !== '' ? esc(pct) : ''}"><span>%</span></div><button type="button" data-a="alloc-del" class="dng team-alloc-del" title="Remove">×</button></div>`;
    }
    function syncTeamAlloc() {
      const box = $('#team-alloc-box'); if (!box) return;
      const rows = box.querySelectorAll('.team-alloc-row'), allocs = []; let total = 0;
      rows.forEach(r => {
        const emp = (r.querySelector('.team-alloc-emp')?.value || '').trim();
        const pctVal = (r.querySelector('.team-alloc-pct')?.value || '').trim();
        if (emp) { const pct = pctVal === '' ? 100 : (parseInt(pctVal, 10) || 0); allocs.push(`${emp}:${pct}`); total += pct }
      });
      const hidden = box.querySelector('#team-alloc-val'); if (hidden) hidden.value = allocs.join(', ');
      const sumEl = box.querySelector('#team-alloc-summary'); if (sumEl) sumEl.innerHTML = `Total: <b style="color:${total > 100 ? 'var(--r)' : total === 100 ? 'var(--g)' : 'inherit'}">${total}%</b>`;
    }
    function addAllocRow() {
      const list = $('#team-alloc-list'); if (!list) return;
      const div = document.createElement('div'); div.innerHTML = createAllocRowHtml('', '');
      list.appendChild(div.firstElementChild); syncTeamAlloc();
    }
    function delAllocRow(btn) {
      const row = btn.closest('.team-alloc-row');
      if (row) {
        const list = row.parentElement; row.remove();
        if (list && list.children.length === 0) addAllocRow(); else syncTeamAlloc();
      }
    }
    const avail = () => 100 - D.cfg.buffer, pst = l => l > avail() ? 'Overloaded' : l < avail() * .5 ? 'Underutilised' : 'Balanced';
    const gate = m => m.status == 'Done' ? (m.gate || 'Pending') : (m.gate == 'Rejected' ? 'Rejected' : ''), fin = m => gate(m) == 'Validated', PV = () => D.ms.filter(m => gate(m) == 'Pending').length;
    const msst = m => esc(m.status) + (gate(m) ? ` <span class="pill ${gate(m) == 'Validated' ? 'Green' : gate(m) == 'Rejected' ? 'Red' : 'Amber'}">${gate(m) == 'Pending' ? 'Awaiting validation' : gate(m)}</span>` : ''), msb = m => m.status != 'Done' ? btn('msdone', 'ms', m.id, 'Complete') : gate(m) == 'Pending' ? btn('vrev', 'ms', m.id, 'Validate', 'pri') : '';
    const od = m => m.status != 'Done' && m.pEnd && m.pEnd < TODAY(), msOf = i => D.ms.filter(m => m.iid == i.id);
    const nextMs = i => msOf(i).filter(m => m.status != 'Done').sort((a, b) => (a.pEnd || '9') > (b.pEnd || '9') ? 1 : -1)[0];
    function prog(i) { const m = msOf(i); return m.length ? Math.round(m.filter(fin).length / m.length * 100) : +i.progress || 0 }
    function health(i) {
      if (!ACT.includes(i.status)) return { h: i.status == 'Completed' ? 'Done' : 'na', w: [] };
      const w = [], g = [], ms = msOf(i), t = TODAY(), hi = ['Critical', 'High'].includes(i.priority), n = nextMs(i); let r = 0, a = 0;
      if (!i.owner) g.push('No accountable owner'); if (!i.priority) g.push('No priority'); if (!i.target && i.status != 'Ongoing') g.push('No target date');
      if (!ms.length) g.push('No milestones'); else if (!n && prog(i) < 100) g.push('No open milestone'); else if (n && !n.holder) g.push('Next milestone has no action holder');
      ms.filter(od).forEach(m => { hi ? r++ : a++; w.push('Milestone overdue: ' + m.name) });
      D.act.filter(b => b.iid == i.id && b.type == 'Blocker' && b.status != 'Done').forEach(b => { (b.severity == 'Critical' || age(b) > D.cfg.blockerDays) ? r++ : a++; w.push('Blocker: ' + b.title) });
      if (i.status == 'Blocked') { r++; w.push('Initiative status is Blocked') }
      if (i.target && i.target < t && prog(i) < 100) { r++; w.push('Target date passed') }
      ms.filter(m => m.status == 'Not Started' && m.pEnd >= t && days(m.pEnd) <= D.cfg.soon).forEach(m => { a++; w.push('Due soon, not started: ' + m.name) });
      if (i.owner && pst(ld(i.owner)) == 'Overloaded') { a++; w.push('Owner is overloaded') }
      if (r) return { h: 'Red', w }; if (a) return { h: 'Amber', w: w.concat(g) }; if (g.length) return { h: 'Grey', w: g }; return { h: 'Green', w: ['On track'] }
    }
    function dq() {
      const q = [], t = TODAY(); D.init.filter(i => ACT.includes(i.status)).forEach(i => {
        const n = nextMs(i), c = (x) => q.push(i.id + ' ' + i.name + ': ' + x);
        if (!i.owner) c('no accountable owner'); if (!i.priority) c('no priority'); if (!i.target && i.status != 'Ongoing') c('no target date'); if (!n && prog(i) < 100) c('no next milestone');
        if (!i.updated || days(t, i.updated) > D.cfg.stale) c('stale update (>' + D.cfg.stale + ' days)')
      });
      D.ms.forEach(m => { if (m.status != 'Done' && !m.holder) q.push(m.id + ' ' + m.name + ': milestone without action holder') });
      D.act.forEach(a => { if (a.type == 'Blocker' && a.status != 'Done' && !a.owner) q.push(a.id + ' ' + a.title + ': blocker without resolution owner') }); return q
    }
    function top5() {
      const c = [], t = TODAY(), B = D.cfg.blockerDays, under = D.team.filter(p => pst(ld(p.id)) == 'Underutilised');
      D.init.filter(i => ACT.includes(i.status)).forEach(i => {
        const h = health(i), n = nextMs(i), hi = pw(i.priority) >= 3;
        if (h.h == 'Red') c.push({ s: (hi ? 100 : 80) + pw(i.priority), w: `${i.id} ${i.name} is Red`, y: h.w.join('; '), a: n ? `Agree recovery date for "${n.name}"` : 'Define next milestone and recovery plan', o: nm(n?.holder || i.owner), d: n?.pEnd });
        if (h.h == 'Green' || h.h == 'Amber') {
          if (i.dev == 'Yes' && i.test == 'Yes' && i.accept == 'Yes' && i.rollout != 'Yes') c.push({ s: 50, w: `${i.name} is ready for rollout`, y: 'Accepted but not rolled out — value not yet delivered', a: 'Schedule rollout and user training', o: nm(i.owner) });
          else if (i.rollout == 'Yes' && i.adopt != 'Yes') c.push({ s: 45, w: `${i.name}: rolled out, adoption not evidenced`, y: 'Technical completion is not business value', a: 'Capture adoption evidence / drive usage', o: nm(i.owner) });
          if (under.length && n && prog(i) >= 80) c.push({ s: 40, w: `Quick win: ${i.name} is ${prog(i)}% complete`, y: `${nm(under[0].id)} has spare capacity`, a: `Close "${n.name}" with ${nm(under[0].id)}`, o: nm(under[0].id), d: n.pEnd })
        }
      });

    function iso(y, m, d) { y = +y; m = +m; d = +d; if (y < 100) y += 2000; const t = new Date(Date.UTC(y, m - 1, d)); return t.getUTCFullYear() == y && t.getUTCMonth() == m - 1 && t.getUTCDate() == d ? `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` : null }
    function pdate(v) {
      v = String(v).trim(); let x, m;
      if (/^\d{5}$/.test(v) && +v > 20000 && +v < 80000) return new Date(Math.round((+v - 25569) * 864e5)).toISOString().slice(0, 10);
      if (x = v.match(/^(\d{4})[-\/. ](\d{1,2})[-\/. ](\d{1,2})(?:[T ].*)?$/)) return iso(x[1], x[2], x[3]);
